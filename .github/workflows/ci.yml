name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest torch transformers peft parquet pyarrow

      - name: Run pytest
        run: |
          pytest tests/ -v

      - name: Validate Empirical Provenance Artifacts
        run: |
          python scripts/validate_empirical_artifacts.py artifacts/empirical
