[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-rl-forge"
version = "0.1.0"
description = "Capability-Aware Dynamic Reinforcement Learning for Foundation Model Training"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.36.0",
    "datasets>=2.16.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.2.0",
    "matplotlib>=3.7.0",
    "pyarrow>=12.0.0",
    "fastparquet>=2023.4.0",
    "pytest>=7.0.0"
]

[tool.setuptools]
packages = ["adaptive_rl_forge", "adaptive_rl_forge.models", "adaptive_rl_forge.datasets", "adaptive_rl_forge.rewards", "adaptive_rl_forge.ntp", "adaptive_rl_forge.sft", "adaptive_rl_forge.rl", "adaptive_rl_forge.carls", "adaptive_rl_forge.metrics", "adaptive_rl_forge.eval", "adaptive_rl_forge.analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
